name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same image Docker Compose uses. The knowledge base needs the
        # vector extension, so plain postgres:16 would fail migration 003.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: servicedesk
          POSTGRES_PASSWORD: servicedesk_ci
          POSTGRES_DB: servicedesk_test
        ports:
          - 5432:5432
        # Without this the job races the database and the first query fails.
        options: >-
          --health-cmd "pg_isready -U servicedesk -d servicedesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://servicedesk:servicedesk_ci@localhost:5432/servicedesk_test
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
      CORS_ORIGIN: http://localhost:5173
      # The offline providers keep CI hermetic: no keys, no network calls to
      # third parties, and therefore deterministic results.
      AI_PROVIDER: fallback
      EMBEDDING_PROVIDER: deterministic
      WHATSAPP_PROVIDER: simulator
      LOG_LEVEL: silent

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

      - name: AI evaluation
        # Reports measured classification and retrieval metrics into the build
        # log. Informational: a metric shift should be visible, not a red build.
        run: npm run eval
        continue-on-error: true

  frontend:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Proves the images still build. Not pushed anywhere; the point is to
      # catch a Dockerfile that broke, before a deploy does.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
