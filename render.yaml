# ---------------------------------------------------------------------------
# Render Blueprint — infrastructure as code.
#
# Provisions the API and a managed PostgreSQL together, so deployment is a
# repeatable definition in version control rather than a sequence of clicks in
# a dashboard that nobody can reproduce.
#
#   1. Push this file to the default branch.
#   2. Render dashboard → New → Blueprint → select this repository.
#   3. Supply the secrets marked sync:false when prompted.
#   4. After the first deploy, set CORS_ORIGIN to the deployed frontend URL.
#
# The frontend deploys separately on Vercel (see frontend/vercel.json), because
# static assets belong on a CDN rather than in a container.
# ---------------------------------------------------------------------------

databases:
  - name: servicedesk-db
    databaseName: servicedesk
    user: servicedesk
    plan: free
    # Must match the API's region: the internal connection string wired into
    # DATABASE_URL only resolves from services in the same region.
    region: singapore
    # Render's PostgreSQL includes pgvector; migration 003 enables the
    # extension itself, so no manual step is required.
    postgresMajorVersion: '16'

services:
  - type: web
    name: servicedesk-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend

    # --include=dev is required: NODE_ENV=production makes npm ci skip
    # devDependencies, and both the compiler (tsc) and the migration runner
    # (tsx) live there.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run before the server binds its port, so the schema is
    # current before new code serves traffic and a failed migration stops the
    # deploy. Render's separate preDeployCommand is not available on the free
    # instance type, so the migration is chained into the start command.
    startCommand: npm run migrate && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: LOG_LEVEL
        value: info

      # Wired automatically from the database defined above.
      - key: DATABASE_URL
        fromDatabase:
          name: servicedesk-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'

      # Generated by Render on first deploy and never shown in this file.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d

      # Must be the exact frontend origin — no trailing slash. A wildcard
      # cannot be used because the app sends credentials.
      - key: CORS_ORIGIN
        sync: false

      # Optional. Absent values leave the offline providers active, so the
      # deployment works before any third-party account exists.
      - key: AI_PROVIDER
        value: fallback
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5

      - key: EMBEDDING_PROVIDER
        value: deterministic
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      - key: WHATSAPP_PROVIDER
        value: simulator
      - key: WHATSAPP_ACCOUNT_SID
        sync: false
      - key: WHATSAPP_AUTH_TOKEN
        sync: false
      - key: WHATSAPP_FROM_NUMBER
        sync: false
      - key: WHATSAPP_WEBHOOK_URL
        sync: false
